services:

  db:
    image: mariadb:10.11
    container_name: triage-db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASS:-root}
      MARIADB_DATABASE: triage
      MARIADB_USER: ${DB_USER:-triage_user}
      MARIADB_PASSWORD: ${DB_PASS:-triage_pass}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  app:
    build: .
    container_name: triage-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:mariadb://db:3306/triage
      DB_USER: ${DB_USER:-triage_user}
      DB_PASS: ${DB_PASS:-triage_pass}
      JWT_SECRET: ${JWT_SECRET:-c2VjcmV0LWp3dC1rZXktdHJpYWdlLWFjYWRlbWljby0yMDI1LXNlZ3Vy}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:4200}

volumes:
  db_data:
