<div class="list-container">
  <div class="page-header">
    <h2>Usuarios</h2>
    <a mat-raised-button color="primary" routerLink="nuevo">
      Nuevo Usuario
    </a>
  </div>

  <mat-card class="filter-card">
    <mat-card-content>
      <form [formGroup]="filterForm" class="filter-form">
        <mat-form-field appearance="outline">
          <mat-label>Rol</mat-label>
          <mat-select formControlName="rol">
            <mat-option [value]="null">Todos</mat-option>
            @for (r of rolOptions; track r) {
              <mat-option [value]="r">{{ r }}</mat-option>
            }
          </mat-select>
        </mat-form-field>

        <div class="filter-actions">
          <button mat-raised-button color="primary" type="button" (click)="buscar()">
            Buscar
          </button>
          <button mat-stroked-button type="button" (click)="limpiarFiltros()">
            Limpiar
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>

  @if (loading) {
    <div class="spinner-container">
      <mat-spinner diameter="48"></mat-spinner>
    </div>
  } @else {
    <mat-card>
      <table mat-table [dataSource]="dataSource" class="full-width">
        <ng-container matColumnDef="id">
          <th mat-header-cell *matHeaderCellDef>#</th>
          <td mat-cell *matCellDef="let row">{{ row.id }}</td>
        </ng-container>

        <ng-container matColumnDef="nombre">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
        </ng-container>

        <ng-container matColumnDef="email">
          <th mat-header-cell *matHeaderCellDef>Email</th>
          <td mat-cell *matCellDef="let row">{{ row.email }}</td>
        </ng-container>

        <ng-container matColumnDef="rol">
          <th mat-header-cell *matHeaderCellDef>Rol</th>
          <td mat-cell *matCellDef="let row">
            <span class="rol-badge rol-{{ row.rol }}">{{ row.rol }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="activo">
          <th mat-header-cell *matHeaderCellDef>Activo</th>
          <td mat-cell *matCellDef="let row">
            @if (row.activo) {
            } @else {
            }
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        @if (dataSource.length === 0) {
          <tr class="mat-row">
            <td class="mat-cell no-data-cell" [attr.colspan]="displayedColumns.length">
              No se encontraron usuarios.
            </td>
          </tr>
        }
      </table>
    </mat-card>
  }
</div>
